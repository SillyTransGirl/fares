<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- OG embed meta; server injects real values when ?from&to are present -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="fares">
<meta property="og:title" content="fares">
<meta property="og:description" content="Fare comparison across SBB, DB, Flix, CD/IDOS">
<meta property="og:image" content="https://fare.sillytransfem.online/og.png">
<meta name="twitter:card" content="summary_large_image">
<title>fares</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0505;color:#c9c9c9;font-family:monospace;padding:3vh 4vw}
h1{color:#8b0000;font-size:2.2rem;font-weight:900;letter-spacing:-1px;margin-bottom:3vh}
input,button{background:#151010;color:#c9c9c9;border:1px solid #3a2020;font-family:monospace;padding:8px 10px;font-size:1rem}
button{cursor:pointer}
button:hover{background:#2a1010}
.grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:3vh}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #241414;font-size:.95rem}
th{color:#8b0000}
td svg{vertical-align:middle}
.price{color:#ff5c5c;font-weight:900;text-decoration:none;cursor:pointer}
.price:hover{text-decoration:underline}
.bad{color:#6aa;font-size:.8rem}
.stat{display:inline-block;margin-right:12px;font-size:.85rem}
.stat.ok{color:#6b8;}.stat.error,.stat.blocked,.stat.timeout{color:#b33}.stat.empty{color:#996}
.hint{color:#555;font-size:.8rem;margin-top:4vh}
.ac{position:relative;display:inline-flex;align-items:center}
.ac svg{width:16px;height:16px;fill:#8b0000;margin-right:4px;flex-shrink:0}
.ac input{width:260px}
.ac .list{position:absolute;top:100%;left:0;right:0;z-index:10;background:#151010;border:1px solid #3a2020;max-height:220px;overflow:auto;display:none}
.ac .list div{padding:7px 10px;cursor:pointer;border-bottom:1px solid #241414;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac .list div:hover,.ac .list div.hl{background:#2a1010;color:#ff5c5c}
.deals{margin-top:5vh;border-top:1px solid #241414;padding-top:3vh}
.deals h2{color:#8b0000;font-size:1.4rem;margin-bottom:2vh}
.deals-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.deal-card{background:#151010;border:1px solid #3a2020;padding:12px;border-radius:4px}
.deal-card .route{color:#c9c9c9;font-size:.95rem;margin-bottom:6px}
.deal-card .route .arrow{color:#8b0000}
.deal-card .meta{color:#666;font-size:.8rem;display:flex;align-items:center;gap:6px}
.deal-card .meta svg{width:24px;height:12px}
.deal-card .deal-price{color:#ff5c5c;font-weight:900;font-size:1.1rem;margin-top:6px}
.deal-card .deal-price a{color:#ff5c5c;text-decoration:none}
.deal-card .deal-price a:hover{text-decoration:underline}
.deal-card .deal-date{color:#555;font-size:.75rem}
.deals-loading{color:#555;font-size:.9rem}
</style>
</head>
<body>
<h1>fares</h1>
<div class="grid">
<div class="ac"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg><input id="from" placeholder="from" value="Praha" autocomplete="off"><div class="list" data-for="from"></div></div>
<div class="ac"><svg viewBox="0 0 24 24"><path d="M12 2l-5.5 9h11L12 2zm0 3.84L13.93 9h-3.87L12 5.84zM17.5 13c-2.49 0-4.5 2.01-4.5 4.5S15.01 22 17.5 22 22 19.99 22 17.5 19.99 13 17.5 13zm0 7c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5zM3 21.5h8v-8H3v8zm2-6h4v4H5v-4z"/></svg><input id="to" placeholder="to" value="Berlin Hbf" autocomplete="off"><div class="list" data-for="to"></div></div>
<input id="date" type="date">
<button onclick="go()">search fares</button>
<select id="cur" title="currency" onchange="render()">
<option value="EUR" selected>EUR (default)</option>
<option value="CHF">CHF</option>
<option value="orig">original</option>
</select>
</div>
<div id="stats"></div>
<table id="rows"><thead><tr><th>when</th><th>line</th><th>train</th><th>duration</th><th>price</th><th>provider</th></tr></thead><tbody></tbody></table>
<p class="hint" id="hint"></p>
<div class="deals" id="deals">
<h2>bang for your buck</h2>
<p class="deals-loading" id="deals-loading">loading cheap trips for tomorrow...</p>
<div class="deals-grid" id="deals-grid"></div>
</div>
<script>
const fmt=(iso)=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});};
const dur=(m)=>m==null?'—':(Math.floor(m/60)+'h '+(m%60)+'m');
const RATE=1.05; // 1 CHF = 1.05 EUR (mirror of server CHF_EUR_RATE)
const fmtMoney=(v)=>v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const SYM={EUR:'€',CHF:'CHF',CZK:'Kč'};
let lastOffers=[];
// convert price+currency to the selected display currency (EUR default)
const inCur=(o,c)=>{
  if(o.price==null) return null;
  if(c==='orig'||o.currency===c) return o.price;
  if(o.currency==='CHF'&&c==='EUR') return o.price/RATE;
  if(o.currency==='EUR'&&c==='CHF') return o.price*RATE;
  return o.price;
};
const money=(o)=>{
  if(o.note) return `<span class="bad">${o.note}</span>`;
  if(o.price==null) return '<span class="bad">no price</span>';
  const c=document.getElementById('cur').value;
  const val=inCur(o,c);
  const cur=(c==='orig'?o.currency:c);
  const inner=`<b>${fmtMoney(val)}</b> ${SYM[cur]||cur}`;
  return o.url ? `<a class="price" href="${o.url}" target="_blank" rel="noopener noreferrer">${inner}</a>` : inner;
};
const LOGO={
db:'<svg viewBox="0 0 60 36" height="16" style="vertical-align:middle"><rect x="1" y="1" width="58" height="34" rx="5" fill="#c1002a" stroke="#c1002a" stroke-width="2"/><rect x="5" y="5" width="50" height="26" rx="3" fill="#fff"/><text x="30" y="24" text-anchor="middle" font-size="19" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#c1002a">DB</text></svg>',
flix:'<svg viewBox="0 0 80 20" height="14" style="vertical-align:middle"><rect width="80" height="20" rx="4" fill="#73d700"/><text x="40" y="14.5" text-anchor="middle" font-size="11" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#1a1a1a">flixtrain</text></svg>',
sbb:'<svg viewBox="0 0 72 20" height="14" style="vertical-align:middle"><rect width="72" height="20" rx="3" fill="#c1002a"/><text x="10" y="15" font-size="14" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#fff">SBB</text><text x="38" y="15" font-size="10" font-family="Arial,Helvetica,sans-serif" fill="#fff">CFF FFS</text></svg>',
leo:'<svg viewBox="0 0 80 20" height="14" style="vertical-align:middle"><rect width="80" height="20" rx="3" fill="#00a651"/><text x="40" y="14.5" text-anchor="middle" font-size="11" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#fff">Leo Express</text></svg>',
cd:'<svg viewBox="0 0 64 20" height="14" style="vertical-align:middle"><rect width="64" height="20" rx="3" fill="#004494"/><text x="8" y="15" font-size="14" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#fff">ČD</text><text x="32" y="15" font-size="9" font-family="Arial,Helvetica,sans-serif" fill="#fff">dráhy</text></svg>',
idos:'<svg viewBox="0 0 50 20" height="14" style="vertical-align:middle"><rect width="50" height="20" rx="3" fill="#e8451a"/><text x="25" y="14.5" text-anchor="middle" font-size="11" font-weight="900" font-family="Arial,Helvetica,sans-serif" fill="#fff">IDOS</text></svg>'
};
const logoFor=(p)=>LOGO[p]||`<span style="color:#8b0000;font-weight:700;font-size:.85rem">${p||'?'}</span>`;
const render=()=>{
  const tbody=document.querySelector('#rows tbody');
  const seen=new Set();
  const rows=[];
  for(const o of lastOffers){
    const k=o.provider+'|'+(o.departure||'')+'|'+o.product;
    if(seen.has(k)) continue;
    seen.add(k);
    rows.push(`<tr>
      <td>${fmt(o.departure)}</td>
      <td>${logoFor(o.provider)}</td>
      <td>${o.product||'—'}</td>
      <td>${dur(o.durationMin)}</td>
      <td class="price">${money(o)}</td>
      <td class="bad">${o.providerLabel}${o.bookedOut?' · sold out':''}</td>
    </tr>`);
  }
  tbody.innerHTML=rows.join('')||'<tr><td colspan="6">no offers</td></tr>';
};

// --- station autocomplete (SBB GraphQL places via /api/suggest) ---
const acs=document.querySelectorAll('.ac');
const acState=new Map();
for(const ac of acs){
  const input=ac.querySelector('input');
  const list=ac.querySelector('.list');
  const state={input,list,timer:null,items:[],hl:-1,shown:false};
  acState.set(input.id,state);

  const close=()=>{state.shown=false;state.hl=-1;list.style.display='none';};
  const pick=(it)=>{
    input.value=it.name;
    input.dataset.id=it.id||'';
    list.innerHTML='';
    close();
  };
  const render=()=>{
    list.innerHTML=state.items.map((it,i)=>{
      const hl= i===state.hl?' hl':'';
      const sub= it.id?'<span class="bad"> '+it.id+'</span>':'';
      return `<div class="item${hl}" data-i="${i}">${it.name.replace(/&/g,'&amp;')}${sub}</div>`;
    }).join('');
    const divs=list.querySelectorAll('.item');
    divs.forEach(d=>d.addEventListener('click',()=>pick(state.items[+d.dataset.i])));
    list.style.display= state.items.length?'block':'none';
    state.shown= state.items.length>0;
  };
  const fetch_=async()=>{
    const q=input.value.trim();
    if(q.length<2){close();return;}
    try{
      const r=await fetch('/api/suggest?q='+encodeURIComponent(q));
      const d=await r.json();
      state.items=(d.results||[]).slice(0,12);
      state.hl=-1;
      render();
    }catch{close();}
  };
  input.addEventListener('input',()=>{
    clearTimeout(state.timer);
    state.timer=setTimeout(fetch_,180);
  });
  input.addEventListener('focus',()=>{ if(state.items.length) render(); });
  input.addEventListener('keydown',(e)=>{
    if(!state.shown) return;
    if(e.key==='ArrowDown'){state.hl=(state.hl+1)%state.items.length;render();e.preventDefault();}
    else if(e.key==='ArrowUp'){state.hl=(state.hl-1+state.items.length)%state.items.length;render();e.preventDefault();}
    else if(e.key==='Enter'){ if(state.hl>=0){pick(state.items[state.hl]);e.preventDefault();} close(); }
    else if(e.key==='Escape'){close();}
  });
  document.addEventListener('click',(e)=>{
    if(!ac.contains(e.target)) close();
  });
}
window.acCloseAll=()=>{acs.forEach(ac=>{const s=acState.get(ac.querySelector('input').id); if(s) s.list.style.display='none';});};

async function go(){
  const from=document.getElementById('from').value.trim();
  const to=document.getElementById('to').value.trim();
  const date=document.getElementById('date').value;
  const stats=document.getElementById('stats');
  stats.innerHTML='searching…';
  const u='/api/search?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+(date?'&date='+date:'');
  try{
    const r=await (await fetch(u)).json();
    stats.innerHTML=(r.statuses||[]).map(s=>`<span class="stat ${s.status}">${s.label}: ${s.status}${s.error?' — '+s.error:''}</span>`).join('')||'no providers';
    lastOffers=r.offers||[];
    render();
  }catch(e){stats.innerHTML='error: '+e.message;}
}
// default date = today
(()=>{const d=new Date();document.getElementById('date').value=d.toISOString().slice(0,10);})();
// URL params (?from=&to=&date=) drive the embed page → prefill + immediate search
(()=>{
  const p=new URLSearchParams(location.search);
  const from=p.get('from'), to=p.get('to'), date=p.get('date');
  if(from)document.getElementById('from').value=from;
  if(to)document.getElementById('to').value=to;
  if(date){
    const d=new Date(date+'T12:00:00Z');
    if(!isNaN(d))document.getElementById('date').value=d.toISOString().slice(0,10);
  }
})();
go();
// Load deals
(async()=>{
  try{
    const r=await fetch('/api/deals');
    const d=await r.json();
    const grid=document.getElementById('deals-grid');
    const loading=document.getElementById('deals-loading');
    const deals=d.deals||[];
    if(!deals.length){loading.textContent='no cheap trips found';return;}
    loading.style.display='none';
    grid.innerHTML=deals.map(o=>{
      const price=o.price!=null?`<span class="deal-price"><a href="${o.url||'#'}" target="_blank" rel="noopener">${fmtMoney(inCur(o,'EUR'))} €</a></span>`:'<span class="deal-price bad">no price</span>';
      const dep=o.departure?fmt(o.departure):'';
      return `<div class="deal-card">
        <div class="route">${o.dealFrom||'?'} <span class="arrow">→</span> ${o.dealTo||'?'}</div>
        <div class="meta">${o.product||''} · ${logoFor(o.provider)} ${o.providerLabel||''}</div>
        ${price}
        <div class="deal-date">${o.dealDate||''} ${dep}</div>
      </div>`;
    }).join('');
  }catch{document.getElementById('deals-loading').textContent='failed to load deals';}
})();
</script>
</body>
</html>
